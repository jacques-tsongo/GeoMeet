<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rencontre - GeoMeet</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="meeting-page">
  <nav class="navbar map-nav">
    <a class="nav-brand" href="dashboard.html"><span>G</span>GeoMeet</a>
    <div class="nav-actions">
      <strong id="meetingPeer">Session active</strong>
      <button id="endSessionBtn" class="btn danger">Terminer</button>
    </div>
  </nav>

  <main class="map-layout">
    <aside class="meeting-sidebar">
      <h1>Localisation en direct</h1>
      <div class="metric">
        <span>Distance</span>
        <strong id="distanceText">En attente...</strong>
      </div>
      <div class="metric">
        <span>Temps estime</span>
        <strong id="durationText">--</strong>
      </div>
      <div class="participants">
        <div id="meCard" class="participant"></div>
        <div id="peerCard" class="participant"></div>
      </div>
      <h2>Itineraire</h2>
      <ol id="instructions" class="instructions"></ol>
    </aside>
    <section id="map" class="map"></section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/meeting.js"></script>
</body>
</html>
